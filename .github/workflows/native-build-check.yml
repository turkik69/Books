name: Native build check

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app.js"
      - "styles.css"
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "native/**"
      - "scripts/**"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run native:prepare
      - run: npx cap add android
      - run: npm run native:configure
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run native:prepare
      - run: npx cap add ios
      - run: npm run native:configure
      - run: npx cap sync ios
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
